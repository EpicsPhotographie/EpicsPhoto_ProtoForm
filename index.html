<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Epics Photographie - Zone Concours</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <div class="background">
    <img src="logo.jpg" alt="Logo Epics" class="logo">

    <h1 class="titre">EPICS PHOTOGRAPHIE - ZONE CONCOURS</h1>

    <div class="form-box">
      <h2>[BILLET DE PARTICIPATION]</h2>
      <form id="formulaire-concours">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <p class="info-facebook">Validation par Facebook</p>

        <label for="courriel">Courriel :</label>
        <input type="email" id="courriel" name="courriel" required>

        <label for="code">Code de connexion :</label>
        <input type="text" id="code" name="code" required>

        <button type="submit">VALIDER</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
